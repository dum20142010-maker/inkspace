<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1329"/>
      <stop offset="50%" stop-color="#141838"/>
      <stop offset="100%" stop-color="#1b1c4b"/>
    </linearGradient>

    <linearGradient id="penBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="penTip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <linearGradient id="orbitGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="pageShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Icon Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#iconBg)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#374151" stroke-width="2" opacity="0.3"/>

  <!-- Document Page Base -->
  <g filter="url(#pageShadow)">
    <path d="M 180 120 L 300 120 L 350 170 L 350 380 C 350 395, 338 400, 325 400 L 180 400 C 165 400, 150 390, 150 375 L 150 145 C 150 130, 165 120, 180 120 Z" 
          fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Folded Corner -->
    <path d="M 300 120 L 300 170 L 350 170 Z" fill="#cbd5e1"/>
  </g>

  <!-- Cyan Orbital Ring (Behind Pen) -->
  <ellipse cx="256" cy="275" rx="170" ry="50" 
           fill="none" stroke="url(#orbitGlow)" stroke-width="14" 
           transform="rotate(-20 256 275)" 
           filter="url(#cyanGlow)" 
           stroke-dasharray="320 180" stroke-dashoffset="40"/>

  <!-- Stylus Pen (Tilted Angle) -->
  <g transform="rotate(-35 256 256)">
    <!-- Pen Barrel Outer Glow -->
    <rect x="226" y="100" width="60" height="280" rx="30" fill="url(#penBody)"/>
    <rect x="230" y="104" width="52" height="272" rx="26" fill="none" stroke="#a5b4fc" stroke-width="3" opacity="0.8"/>
    
    <!-- Pen Tip -->
    <path d="M 226 350 L 286 350 L 256 420 Z" fill="url(#penTip)"/>
    <path d="M 256 350 L 256 415" stroke="#1e1b4b" stroke-width="3"/>
  </g>

  <!-- Cyan Orbital Ring (Front Crossing) -->
  <ellipse cx="256" cy="275" rx="170" ry="50" 
           fill="none" stroke="url(#orbitGlow)" stroke-width="14" 
           transform="rotate(-20 256 275)" 
           filter="url(#cyanGlow)" 
           stroke-dasharray="180 320" stroke-dashoffset="-210"/>
</svg>
